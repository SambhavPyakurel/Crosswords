<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Crossword Studio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .builder-cell input {
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Local Crossword Studio</h1>
    <span style="font-size: 0.85rem; color: #64748b;">Design & Export</span>
  </header>

  <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 1.5rem;">
    Type your word solutions in the grid. Use <code>#</code> or leave a cell blank to create a <strong>black block</strong>.
  </p>

  <div style="display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 2rem;">
    <div class="grid-container">
      <div id="builderGrid" class="grid"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 0.75rem; justify-content: center;">
      <button class="btn btn-primary" onclick="downloadPuzzleJSON()">📥 Download puzzle.json</button>
      <button class="btn" onclick="generateClueInputs()">🔄 Refresh Clues from Grid</button>
    </div>
  </div>

  <div class="clues-container">
    <div>
      <h3>Across Clues</h3>
      <div id="builderAcrossClues"></div>
    </div>
    <div>
      <h3>Down Clues</h3>
      <div id="builderDownClues"></div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
